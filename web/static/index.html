<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baixador de Vídeos do Telegram</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Baixador de Vídeos do Telegram</h1>
    <p id="status">Carregando status…</p>
  </header>

  <section id="secao-login">
    <h2>1. Login no Telegram</h2>
    <div id="login-form">
      <label>Telefone (com DDI/DDD, ex.: +55 71 99999-9999)
        <input id="telefone" type="tel" autocomplete="tel">
      </label>
      <button id="btn-codigo">Enviar código</button>

      <div id="confirmar" hidden>
        <label>Código recebido no Telegram
          <input id="codigo" type="text" inputmode="numeric" autocomplete="one-time-code">
        </label>
        <label id="campo-senha" hidden>Senha do Telegram (verificação em duas etapas)
          <input id="senha" type="password" autocomplete="current-password">
        </label>
        <button id="btn-confirmar">Confirmar login</button>
      </div>
    </div>
    <p id="login-ok" hidden></p>
  </section>

  <section id="secao-download">
    <h2>2. Escolher o que baixar</h2>
    <label>Destino (título, @usuário, link ou ID)
      <input id="destino" type="text" placeholder="Ex.: Meu grupo">
    </label>
    <div class="linha">
      <button id="btn-listar">Listar meus destinos</button>
      <select id="lista-destinos" hidden></select>
    </div>
    <button id="btn-preparar">Verificar destino e tópicos</button>
    <p id="info-destino"></p>

    <label>Tópico
      <select id="topico">
        <option value="">Todos / sem tópico</option>
      </select>
    </label>
    <label>Limite de mensagens analisadas (vazio = todas)
      <input id="limite" type="number" min="1" placeholder="Todas">
    </label>
    <label>Pasta onde salvar
      <input id="pasta" type="text">
    </label>
    <button id="btn-baixar" class="principal">Baixar vídeos</button>
  </section>

  <section id="secao-progresso">
    <h2>3. Progresso</h2>
    <p id="resumo">Nenhum download iniciado.</p>
    <pre id="log"></pre>
  </section>

  <section id="secao-arquivos">
    <h2>4. Vídeos baixados</h2>
    <button id="btn-arquivos">Atualizar lista</button>
    <ul id="arquivos"></ul>
  </section>

  <p id="mensagem" role="alert"></p>
  <script src="app.js"></script>
</body>
</html>
